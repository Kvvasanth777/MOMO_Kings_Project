services:
  db:
    image: postgres:16
    container_name: momo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: momo_kings
      POSTGRES_USER: momo_user
      POSTGRES_PASSWORD: momo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo_user -d momo_kings"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: momo-django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 restaurant_management.wsgi:application"
    volumes:
      - static_volume:/app/restaurant_management/staticfiles
      - media_volume:/app/restaurant_management/media
    ports:
      - "8001:8000"
    environment:
      DB_NAME: momo_kings
      DB_USER: momo_user
      DB_PASSWORD: momo_password
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: change-this-secret-key
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume: