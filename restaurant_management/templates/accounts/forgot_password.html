{% extends 'base.html' %}
{% load static %}

{% block title %}Momo Kings | Password Recovery{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 border-gold text-white text-center">
            <i class="fa-solid fa-key fa-3x text-gold mb-3"></i>
            <h3 class="text-gold mb-2">Forgot Password</h3>
            <p class="text-gray small mb-4">Enter your registered email address and we will send a mock OTP code to reset your password.</p>
            
            <form action="{% url 'forgot_password' %}" method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="email" name="email" required class="form-control bg-transparent text-white border-gold rounded-pill px-3 text-center" placeholder="royal@momokings.com">
                </div>
                
                <button type="submit" class="btn btn-gold w-100 py-3 rounded-pill fw-bold">REQUEST VERIFICATION CODE</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
